version: '{build}'
shallow_clone: true
branches:
  only:
    - master
skip_branch_with_pr: true
environment:
  matrix:
    - appveyor_build_worker_image: Visual Studio 2022
      JAVA_HOME: C:\Program Files\Java\jdk25
init:
  - cmd: SET PATH=%JAVA_HOME%\bin;%PATH%
install:
  - cmd: SET JAVA_OPTS=-Xmx4g
  - cmd: gradlew.bat --version
  - cmd: java -version
build_script:
  - cmd: gradlew.bat --no-daemon clean assemble
test_script:
  - cmd: gradlew.bat --no-daemon check
cache:
  - C:\Users\appveyor\.gradle
artifacts:
  - path: build\libs\Regionerator-3.0.3-SNAPSHOT-FORK.jar
    name: Regionerator
only_commits:
  files:
    - src/**/*
    - build.gradle.kts
    - settings.gradle.kts
    - gradle.properties
    - gradle/**/*
    - gradlew
    - gradlew.bat
    - header.txt
    - appveyor.yml
